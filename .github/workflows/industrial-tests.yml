name: Industrial predictor tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements_industrial_public.txt
      - run: pip install -r requirements_industrial_public.txt
      - run: python -m pytest tests/test_recent_residual_predictor.py tests/test_residual_reconstruction.py -q
